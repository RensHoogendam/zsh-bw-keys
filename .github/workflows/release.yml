name: Release

# Multi-step deploy: lint + test must pass before the Homebrew formula is bumped.
# On every vX.Y.Z tag (or a manual dispatch), the `test` job parse-lints and runs
# the suite; only if it's green does `bump` recompute the release tarball's sha256
# and update the formula in the tap repo. First-party only — no third-party action
# ever sees the token.
#
# Needs ONE secret — HOMEBREW_TAP_TOKEN — a fine-grained PAT scoped to ONLY
# RensHoogendam/homebrew-tap with Contents: write. The built-in GITHUB_TOKEN can't
# push to another repo, hence this. Without the secret the bump job skips cleanly.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to bump (e.g. v1.1.0)'
        required: true

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Lint (zsh -n)
        run: zsh -n zsh-bw-keys.plugin.zsh
      - name: Test
        run: zsh test/run.zsh

  bump:
    name: bump homebrew formula
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Skip if no tap token configured
        if: env.HAS_TAP_TOKEN != 'true'
        run: |
          echo "::notice::HOMEBREW_TAP_TOKEN is not set — skipping formula bump."
          echo "Add a fine-grained PAT (homebrew-tap, Contents: write) as the"
          echo "HOMEBREW_TAP_TOKEN repo secret to enable auto-bump."

      - name: Check out the tap
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: RensHoogendam/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump formula to ${{ env.TAG }}
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          set -euo pipefail
          SRC=RensHoogendam/zsh-bw-keys
          tarball="https://github.com/$SRC/archive/refs/tags/$TAG.tar.gz"

          # GitHub generates the archive on first request — retry a few times.
          tmp=$(mktemp)
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$tarball" -o "$tmp" && [ -s "$tmp" ]; then break; fi
            echo "waiting for tarball… ($i)"; sleep 3
          done
          [ -s "$tmp" ] || { echo "::error::could not download $tarball"; exit 1; }
          sha=$(sha256sum "$tmp" | cut -d' ' -f1)
          echo "sha256=$sha"

          cd tap
          f=Formula/zsh-bw-keys.rb
          out=$(mktemp)
          sed -E \
            -e "s|archive/refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz|archive/refs/tags/$TAG.tar.gz|" \
            -e "s|sha256 \"[a-f0-9]{64}\"|sha256 \"$sha\"|" \
            "$f" > "$out" && mv "$out" "$f"
          grep -q "tags/$TAG.tar.gz" "$f" || { echo "::error::formula url not updated"; exit 1; }
          grep -q "sha256 \"$sha\"" "$f"   || { echo "::error::formula sha not updated"; exit 1; }

          if git diff --quiet; then
            echo "::notice::formula already at $TAG — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "zsh-bw-keys ${TAG#v}"
          git push
          echo "::notice::bumped tap formula to $TAG"
